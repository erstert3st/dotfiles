# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf
# font_family          JetBrainsMono Nerd Font
# bold_font            none #JetBrainsMono Nerd Font Bold
# italic_font          JetBrainsMono Nerd Font Italic
# bold_italic_font     JetBrainsMono Nerd Font Bold Italic

font_size 12.5
# bold_font off   
# italic_font auto
# bold_italic_font auto



background_opacity 0.8
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4
# Hyprland sizes the windows. Remembering size/maximize state made every new floating
# kitty (e.g. the dropdown) open maximized once a maximized kitty was closed last.
remember_window_size no
# selection_foreground none
# selection_background none
# foreground #dddddd
# background #000000
# cursor #dddddd

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
include themes/noctalia.conf
include tode/keybinds.kitty.conf

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1B7 Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block

# Make obsidian:// links clickable
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh obsidian
# Open links with a plain click even when a program (herdr, vim, ...) grabs the mouse.
# Press/release still reach the program; only the synthetic click event is mapped.
mouse_map left click grabbed mouse_handle_click selection link
