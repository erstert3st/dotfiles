# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi


# windowrule = workspace special:spotify, ^(bt)$

windowrule = match:class (?i)spotify, workspace special:spotify silent
windowrule = match:class (discord|vesktop|WebCord), workspace special:discord silent

# windowrule = match:class ^([Cc]hromium)$, float on
# windowrule = match:class ^([Cc]hromium)$, no_initial_focus on

# Picture-in-Picture mit deutscher UI (FireDragon/Firefox): Titel ist "Bild-im-Bild",
# die Stock-Regel in configs/WindowRules.conf matcht nur den englischen Titel.
windowrule {
    name = Bild-im-Bild
    match:title = ^[Bb]ild-im-[Bb]ild$
    float = on
    move = 72% 7%
    opacity = 0.95 0.75
    pin = on
    keep_aspect_ratio = on
    size = (monitor_w*0.3) (monitor_h*0.3)
}
