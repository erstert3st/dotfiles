# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME



#######MINE
# Desktop-Overview (qs -c overview) deaktiviert — nicht genutzt, spart den Dauerprozess.
# Stock-Bind stammt aus configs/Keybinds.conf:23.
unbind = $mainMod, A

# Dropdown-Terminal als Special-Workspace statt Dropterminal.sh (Stock-Bind configs/Keybinds.conf:54).
# Regeln (kitty-Start, Groesse, Position) in UserConfigs/WindowRules.conf.
unbind = $mainMod SHIFT, Return
bindd = $mainMod SHIFT, Return, DropDown terminal, togglespecialworkspace, dropdown

bind = $mainMod CTRL , SPACE, layoutmsg, togglesplit
# Noctalia-Shell <-> Waybar+swaync umschalten (nie beide). Script prüft, was läuft.
bindd = $mainMod ALT, N, Noctalia-Shell umschalten, exec, $UserScripts/NoctaliaToggle.sh
# App-Launcher: SUPER+D auf Noctalia-Launcher statt rofi (Stock-Bind configs/Keybinds.conf:21).
unbind = $mainMod, D
bindd = $mainMod, D, app launcher, exec, noctalia msg panel-toggle launcher || rofi -show drun -modi drun,filebrowser,run,window
# Clipboard-History (SUPER+V) & Emoji-Picker (SUPER+-) via Noctalia-Launcher.
# Additiv; alte rofi-Binds SUPER ALT+V / SUPER ALT+E bleiben als Fallback.
bindd = $mainMod, V, clipboard history, exec, noctalia msg panel-toggle clipboard
bindd = $mainMod, minus, emoji picker, exec, noctalia msg panel-toggle launcher /emo
bind = , HOME, exec, playerctl play-pause
bind = , PRIOR, exec, playerctl  next
bind = , NEXT, exec, playerctl previous

#bind = ALT, x, togglespecialworkspace, #
bind = ALT, s, togglespecialworkspace, spotify
bind = ALT, d, togglespecialworkspace, discord
bind = ALT, b, togglespecialworkspace, browser
bind = ALT, x, togglespecialworkspace
# bind = , END, exec, DEL






# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# Notification-Panel auf Noctalia statt swaync (Stock-Bind configs/Keybinds.conf:94).
unbind = $mainMod SHIFT, N
bindd = $mainMod SHIFT, N, Notification history, exec, noctalia msg panel-toggle control-center notifications || swaync-client -t -sw
# Bar ein-/ausblenden: Noctalia-Bar statt Waybar-SIGUSR1 (Stock-Bind configs/Keybinds.conf:61).
unbind = $mainMod CTRL ALT, B
bindd = $mainMod CTRL ALT, B, Toggle bar on/off, exec, noctalia msg bar-toggle || pkill -SIGUSR1 waybar

# Lautstaerke ueber Noctalias OSD statt swaync-Popups (Stock-Binds configs/Keybinds.conf:139-144).
# Wrapper faellt im Waybar-Modus automatisch auf scripts/Volume.sh zurueck.
unbind = , xf86audioraisevolume
unbind = , xf86audiolowervolume
unbind = , xf86audiomute
unbind = , xf86AudioMicMute
bindeld = , xf86audioraisevolume, Volume up, exec, $UserScripts/VolumeOSD.sh --inc
bindeld = , xf86audiolowervolume, Volume down, exec, $UserScripts/VolumeOSD.sh --dec
bindld = , xf86audiomute, Toggle mute, exec, $UserScripts/VolumeOSD.sh --toggle
bindld = , xf86AudioMicMute, Toggle mic mute, exec, $UserScripts/VolumeOSD.sh --toggle-mic

# Window-Switcher auf Noctalias Launcher statt rofi (Stock-Bind configs/Keybinds.conf:36).
unbind = $mainMod CTRL, S
bindd = $mainMod CTRL, S, Window switcher, exec, noctalia msg window-switcher || rofi -show window

# Wallpaper aussortieren: verschiebt das aktuelle Bild nach ~/Pictures/wallpapers-rejected
# (taucht danach in keiner Auswahl mehr auf) und setzt sofort ein neues.
bindd = CTRL ALT, Q, Reject wallpaper, exec, $UserScripts/WallpaperReject.sh
bindd = CTRL ALT SHIFT, Q, Undo reject wallpaper, exec, $UserScripts/WallpaperReject.sh --undo

# Wallpaper vollstaendig ueber Noctalia (2026-08-21): awww/WallpaperSelect/WallpaperRandom
# sind abgeloest, Noctalia zeichnet den Layer selbst und rotiert per [wallpaper.automation].
# Stock-Binds: configs/Keybinds.conf:70 und :72.
unbind = $mainMod, W
bindd = $mainMod, W, Select Wallpaper, exec, noctalia msg panel-toggle wallpaper
unbind = CTRL ALT, W
bindd = CTRL ALT, W, Random wallpaper, exec, noctalia msg wallpaper-random

# hyprsunset ist deinstalliert -- Nachtmodus macht Noctalia (2026-08-21).
# Stock-Bind: configs/Keybinds.conf:66 (rief scripts/Hyprsunset.sh toggle, das nur noch
# das State-File umlegte und eine falsche Meldung anzeigte).
unbind = $mainMod, N
bindd = $mainMod, N, Toggle night light, exec, noctalia msg nightlight-force-toggle

# cliphist wird nicht mehr befuellt (wl-paste-Watcher aus dem Autostart genommen), das
# rofi-Menue servierte nur noch einen eingefrorenen Snapshot. Stock-Bind:
# configs/Keybinds.conf:40 -- zeigt jetzt auf dieselbe History wie SUPER+V.
unbind = $mainMod ALT, V
bindd = $mainMod ALT, V, Clipboard history, exec, noctalia msg panel-toggle clipboard

# Waybar-Style/-Layout-Auswahl: relinkt nur noch ungenutzte waybar-Configs und ruft dann
# das geguardete Refresh.sh -- bewirkt also nichts. Stock-Binds: configs/Keybinds.conf:62/63.
unbind = $mainMod CTRL, B
unbind = $mainMod ALT, B

# --- Nachlese Audit 2026-08-21 ---

# Feinschritt-Lautstaerke (ALT+Volume) lief noch ueber scripts/Volume.sh mit
# notify-send-Popups: die unbinds oben (Zeile 85-86) treffen nur die modifier-losen
# Varianten, configs/Keybinds.conf:141-142 blieben stehen. Damit gab es zwei
# konkurrierende OSDs. VolumeOSD.sh kennt --*-precise jetzt nativ (noctalia
# `volume-up [step]`, Step in Prozent = 1, wie Volume.sh' inc_volume 1).
unbind = ALT, xf86audioraisevolume
unbind = ALT, xf86audiolowervolume
bindeld = ALT, xf86audioraisevolume, Volume up precise, exec, $UserScripts/VolumeOSD.sh --inc-precise
bindeld = ALT, xf86audiolowervolume, Volume down precise, exec, $UserScripts/VolumeOSD.sh --dec-precise

# Kollateralschaden reparieren: `unbind = $mainMod ALT, V` (oben, fuer die Clipboard-
# History) entfernt ALLE Binds dieser Kombination -- also auch den Scrolling-Bind aus
# configs/Keybinds.conf:130 ("Vertical Scroll down"). Das Gegenstueck SUPER ALT+H
# (Keybinds.conf:128, horizontal) lebt weiter, deshalb hier auf SUPER ALT+J neu legen
# (vim-Konvention: j = runter, passend zu H = rechts).
bindd = $mainMod ALT, J, Vertical scroll down, exec, hyprctl keyword scrolling:direction down

# Noctalias Dock ist aktiv ([dock] enabled = true in settings.toml), war aber an keine
# Taste gebunden -- Ein-/Ausblenden ging nur ueber die Settings-UI.
bindd = $mainMod ALT, D, Toggle dock on/off, exec, noctalia msg dock-toggle
