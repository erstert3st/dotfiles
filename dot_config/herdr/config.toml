onboarding = false

[keys]
prefix = "ctrl+a"

# Panes mit Pfeiltasten fokussieren (statt vim h/j/k/l)
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Splits: prefix++ und prefix+- als symmetrisches Paar (vorher v / -)
split_vertical = "prefix+plus"
split_horizontal = "prefix+minus"

# Durch die Agent-Liste steppen (priority/Attention-Queue)
previous_agent = "prefix+shift+up"
next_agent = "prefix+shift+down"

# Spaces (Workspaces) wechseln: prefix+shift+←/→
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

# Tabs wechseln: nur die Defaults prefix+p/n.
# Blankes Tab bewusst NICHT belegt (schluckt sonst die Completion in Panes),
# Shift+Tab ebenfalls frei (Claude Code braucht es für den Permission-Mode-Switch).
previous_tab = "prefix+p"
next_tab = "prefix+n"

# https://github.com/smarzban/herdr-file-viewer
[[keys.command]]              # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]              # zoxide-Picker (Verzeichnis-Sprung); überschreibt Default open_notification_target
key = "prefix+o"
type = "shell"
command = "herdr plugin action invoke browse --plugin herdr-zoxide"

[[keys.command]]              # herdr-mirror starten / fortsetzen
key = "prefix+shift+m"
type = "shell"
command = "herdr plugin action invoke start --plugin mirror"

[experimental]
# Kitty-Graphics-Rendering im angehängten Client (braucht kompatibles Outer-Terminal)
kitty_graphics = true
# Pane-Screen-History über volle Server-Neustarts hinweg erhalten
pane_history = false

[ui]
agent_panel_sort = "priority"

# Tab-Zeile (inkl. der tab_bar_right-Statusleiste weiter unten) am unteren Rand.
tab_bar_position = "bottom"

# Gemeldete Agent-/Session-Titel auch in den Split-Pane-Rändern anzeigen
# (wenn kein manueller Pane-Name gesetzt ist).
show_agent_labels_on_pane_borders = true

# Agent-Zeilen: 2. Zeile zeigt den Claude-Session-Titel (via claude-session-title-Plugin
# als terminal_title gemeldet) statt des generischen Agent-Namens "claude".
status_indicators = "symbols"

# Statusleiste rechts in der Tab-Zeile — Adaption der tmux-Statusline
# (~/dotfiles/config/tmux/style.conf: primary_ip · CPU · RAM · weather).
# Die Segment-Skripte liegen in ~/.config/herdr/status/ und laufen auf dem
# herdr-Server, also bei `--remote`/mirror mit den Werten der Gegenseite.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status/ip.sh", interval_seconds = 60, timeout_seconds = 5 },
  { type = "command", command = "~/.config/herdr/status/cpu.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "~/.config/herdr/status/mem.sh", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "~/.config/herdr/status/weather.sh", interval_seconds = 900, timeout_seconds = 10 },
  { type = "datetime", format = "%d.%m %H:%M" },
]
tab_bar_right_separator = " · "
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

# https://github.com/natori-hrj/herdr-lazy
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

[[keys.command]]              # Maschine an plugins.list angleichen (fehlende nachinstallieren)
key = "prefix+shift+u"
type = "plugin_action"
command = "herdr-lazy.sync"
description = "sync plugins"

# https://github.com/thanhdat77/herdr-navigator
# prefix+t ist frei (Default cycle_pane_next liegt auf prefix+tab, nicht prefix+t);
# j/l sind durch die Pfeiltasten-Umbelegung der focus_pane_*-Keys frei geworden.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]              # dieselbe Liste als bleibendes Seiten-Pane (l = rechts)
key = "prefix+l"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator side pane"

[[keys.command]]              # zurück zum zuvor besuchten Workspace
key = "prefix+j"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump back to last workspace"

# https://github.com/AVGVSTVS96/herdr-drovr
# Das README empfiehlt prefix+m/prefix+M — shift+m ist hier schon mirror, darum das
# v-Paar (v = „verschieben", frei geworden durch split_vertical → prefix+plus).
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "drovr.move-pane"
description = "move pane to tab"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "drovr.move-tab"
description = "move tab to workspace"

# https://github.com/natori-hrj/herdr-triage
# Bietet nur ein Pane und keine Action — deshalb type = "shell" statt plugin_action.
[[keys.command]]              # i = Inbox: Agenten nach Aufmerksamkeitsbedarf sortiert
key = "prefix+i"
type = "shell"
command = "herdr plugin pane open --plugin triage --entrypoint list --focus"
description = "attention triage"

[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin"
auto_switch = false

[session]
resume_agents_on_restore = false
