# Sunshine host config for cachyos: headless, no monitor, so no KMS.
# Captures the Hyprland headless output from sunshine-virt-output.service.
# Credentials live in sunshine_state.json next to this file, never in the repo.
capture = wlr
output_name = sunshine-virt
encoder = vaapi
adapter_name = /dev/dri/renderD128
# No tray host in the headless session; with the tray enabled Sunshine exits right after start.
system_tray = disabled
# Web UI opened from other LAN machines; without this, CSRF protection blocks e.g. the PIN form.
csrf_allowed_origins = https://192.168.1.111:47990
